<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-lowest": "#ffffff", "tertiary-fixed": "#ffdbcd", "outline": "#737686", "on-tertiary-fixed": "#360f00", "tertiary-container": "#bc4800", "on-secondary-container": "#00714d", "on-error-container": "#93000a", "on-background": "#0b1c30", "primary-fixed": "#dbe1ff", "secondary": "#006c49", "surface-container-highest": "#d3e4fe", "on-tertiary-fixed-variant": "#7d2d00", "error": "#ba1a1a", "surface": "#f8f9ff", "on-primary": "#ffffff", "secondary-fixed-dim": "#4edea3", "secondary-fixed": "#6ffbbe", "on-tertiary-container": "#ffede6", "tertiary": "#943700", "tertiary-fixed-dim": "#ffb596", "surface-variant": "#d3e4fe", "inverse-primary": "#b4c5ff", "error-container": "#ffdad6", "surface-container-low": "#eff4ff", "surface-tint": "#0053db", "on-surface": "#0b1c30", "on-primary-fixed": "#00174b", "on-primary-fixed-variant": "#003ea8", "on-surface-variant": "#434655", "surface-container": "#e5eeff", "primary": "#004ac6", "on-secondary-fixed-variant": "#005236", "on-secondary": "#ffffff", "secondary-container": "#6cf8bb", "inverse-surface": "#213145", "surface-container-high": "#dce9ff", "primary-container": "#2563eb", "on-primary-container": "#eeefff", "on-secondary-fixed": "#002113", "surface-bright": "#f8f9ff", "background": "#f8f9ff", "surface-dim": "#cbdbf5", "primary-fixed-dim": "#b4c5ff", "outline-variant": "#c3c6d7", "inverse-on-surface": "#eaf1ff", "on-tertiary": "#ffffff", "on-error": "#ffffff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2rem", "space-lg": "1.5rem", "margin-desktop": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "gutter-desktop": "1.5rem", "gutter": "1rem", "space-md": "1rem", "margin": "1rem" }, "fontFamily": { "label-lg": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"] }, "fontSize": { "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen" style="background-color: rgb(247, 244, 238); color: rgb(43, 36, 30);"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe" style="background-color: rgba(247, 244, 238, 0.85); border-bottom: 1px solid rgb(236, 229, 218);"><div class="h-14 px-margin flex items-center justify-between"><div class="w-11 h-11"></div><h1 class="text-headline-sm font-headline-sm text-on-surface tracking-tight text-center flex-1 truncate" style="color: rgb(43, 36, 30);">프로필 수정</h1><button aria-label="닫기" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary transition-colors rounded-full" onclick="history.back()" type="button" style="color: rgb(43, 36, 30);"><span class="material-symbols-outlined text-[24px]">close</span></button></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface" style="background-color: rgb(247, 244, 238);"><div class="flex flex-col w-full pb-10">
<!-- Interactive Form Wrap -->
<form class="flex flex-col w-full px-margin space-y-space-lg" id="edit-profile-form" onsubmit="event.preventDefault(); handleProfileSave();">
<!-- Avatar & Visual Persona Section -->
<div class="flex flex-col items-center justify-center pt-space-md">
<div class="relative group">
<!-- Large Warm Clay & Linen Avatar Container -->
<div class="w-24 h-24 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center shadow-md select-none transition-transform duration-200 active:scale-95" id="avatar-container" style="background-color: rgb(232, 222, 209); color: rgb(90, 74, 62); border: 2px solid rgb(236, 229, 218);">
<span class="font-headline-md text-headline-md font-bold tracking-tight" id="avatar-initials">EJ</span>
</div>
<!-- Camera / Pencil Floating Action Badge -->
<button aria-label="프로필 사진 변경" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center shadow-md active:bg-on-tertiary-fixed-variant transition-colors" onclick="triggerPhotoChange()" type="button" style="background-color: rgb(122, 74, 38); color: rgb(255, 255, 255);">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
</button>
</div>
<!-- Avatar Switching Micro-Controls -->


</div>
<!-- Field 1: Korean / Display Name -->
<div class="flex flex-col bg-surface-container-lowest rounded-xl p-space-md shadow-sm space-y-space-xs" style="background-color: rgb(253, 252, 250); border: 1px solid rgb(236, 229, 218); box-shadow: rgba(90, 74, 62, 0.05) 0px 1px 4px;">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="display-name" style="color: rgb(43, 36, 30);">
<span>이름 / 닉네임</span>
<span class="text-tertiary font-bold" style="color: rgb(122, 74, 38);">*</span>
</label>
<span class="font-label-sm text-label-sm text-outline" id="name-length" style="color: rgb(140, 130, 118);">3 / 12</span>
</div>
<div class="relative flex items-center mt-1">
<input class="w-full h-12 px-3.5 pr-10 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="display-name" maxlength="12" oninput="updateNameCounter(this)" placeholder="이름 또는 닉네임을 입력하세요" required="" type="text" value="이지은" style="background-color: rgb(242, 238, 230); border: 1px solid rgb(221, 214, 200); color: rgb(36, 29, 23);">
<button aria-label="입력 지우기" class="absolute right-2 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface transition-colors" id="clear-name-btn" onclick="clearInput('display-name')" type="button" style="color: rgb(140, 130, 118);">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant pt-0.5" style="color: rgb(110, 100, 90);">
        섀도잉 스튜디오 및 학습 기록 카드에 표시되는 이름입니다. (한글, 영문 최대 12자)
      </p>
</div>
<!-- Field 2: Spanish Call Name / Persona -->

<!-- Field 3: Target Learning Benchmark (CEFR Level) -->

<!-- Field 4: Learning Motto / Daily Commitment -->

<!-- Actions Area -->
<div class="flex flex-col items-center pt-space-xs pb-space-lg space-y-space-sm w-full">
<button class="w-full h-12 rounded-xl bg-tertiary text-on-tertiary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-md hover:bg-on-tertiary-fixed-variant active:scale-[0.99] transition-all" type="submit" style="background-color: rgb(122, 74, 38); color: rgb(255, 255, 255); box-shadow: rgba(122, 74, 38, 0.25) 0px 3px 8px;">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>변경사항 저장하기</span>
</button>
<button class="w-full py-2.5 text-center text-outline hover:text-on-surface font-label-md text-label-md transition-colors" onclick="history.back()" type="button" style="color: rgb(110, 100, 90);">닫기</button>
</div>
</form>
<!-- Interactive Feedback Toast (Delight moment) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 flex items-center gap-2 px-4 py-2.5 rounded-full bg-inverse-surface text-inverse-on-surface shadow-xl opacity-0 translate-y-3" id="toast-notification">
<span class="material-symbols-outlined text-[18px] text-secondary-fixed">verified</span>
<span class="font-label-md text-label-md" id="toast-message">새 프로필 사진 등록 창을 준비 중입니다.</span>
</div>
</div>
<script>
  function updateNameCounter(input) {
    var length = input.value.length;
    var counter = document.getElementById('name-length');
    if (counter) {
      counter.textContent = length + ' / 12';
    }

    var initialsEl = document.getElementById('avatar-initials');
    if (initialsEl && length > 0) {
      var val = input.value.trim();
      var initials = val.length >= 2 ? val.substring(0, 2) : val;
      initialsEl.textContent = initials;
    }
  }

  function clearInput(id) {
    var el = document.getElementById(id);
    if (el) {
      el.value = '';
      el.focus();
      if (id === 'display-name') {
        updateNameCounter(el);
      }
    }
  }

  function selectLevel(levelCode, label, statusText) {
    document.getElementById('selected-level').value = levelCode;
    document.getElementById('level-badge').textContent = statusText;

    var levels = ['A1', 'A2', 'B1', 'B2'];
    levels.forEach(function(code) {
      var btn = document.getElementById('btn-level-' + code);
      var icon = btn.querySelector('.check-icon');
      if (code === levelCode) {
        btn.className = 'level-card flex flex-col p-3 rounded-lg text-left transition-all bg-tertiary text-on-tertiary shadow-sm';
        if (icon) icon.classList.remove('hidden');
      } else {
        btn.className = 'level-card flex flex-col p-3 rounded-lg text-left transition-all bg-surface-container-low text-on-surface-variant hover:bg-surface-container shadow-sm';
        if (icon) icon.classList.add('hidden');
      }
    });
  }

  function resetToInitials() {
    var nameInput = document.getElementById('display-name');
    var initialsEl = document.getElementById('avatar-initials');
    var nameVal = (nameInput && nameInput.value.trim()) || '이지은';
    var initials = nameVal.length >= 2 ? nameVal.substring(0, 2) : nameVal;
    
    if (initialsEl) {
      initialsEl.textContent = initials;
    }
    showToast('기본 이니셜 아바타로 변경되었습니다.');
  }

  function triggerPhotoChange() {
    showToast('새 프로필 사진 등록 창을 준비 중입니다.');
  }

  function handleProfileSave() {
    var nameInput = document.getElementById('display-name');
    if (!nameInput || !nameInput.value.trim()) {
      showToast('이름을 한 글자 이상 입력해 주세요.');
      nameInput && nameInput.focus();
      return;
    }

    showToast('프로필 정보가 안전하게 저장되었습니다!');
    setTimeout(function() {
      if (window.history && window.history.length > 1) {
        window.history.back();
      }
    }, 1200);
  }

  function showToast(message) {
    var toast = document.getElementById('toast-notification');
    var toastMsg = document.getElementById('toast-message');
    if (!toast || !toastMsg) return;

    toastMsg.textContent = message;
    toast.classList.remove('opacity-0', 'translate-y-3');
    toast.classList.add('opacity-100', 'translate-y-0');

    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function() {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'translate-y-3');
    }, 2400);
  }
</script></main>

</body></html>
